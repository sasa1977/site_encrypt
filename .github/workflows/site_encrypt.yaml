name: "site_encrypt"

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CACHE_VERSION: v2

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore cached deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ env.CACHE_VERSION }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ github.ref }}-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}
          restore-keys: |
            deps-${{ env.CACHE_VERSION }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ github.ref }}-
            deps-${{ env.CACHE_VERSION }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Restore cached build
        uses: actions/cache@v4
        with:
          path: _build
          key: build-${{ env.CACHE_VERSION }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ github.ref }}-${{ hashFiles(format('{0}{1}', github.workspace, '/mix.lock')) }}
          restore-keys: |
            build-${{ env.CACHE_VERSION }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ github.ref }}-
            build-${{ env.CACHE_VERSION }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: |
          sudo apt-get install software-properties-common
          sudo apt-get update
          sudo apt-get install -y certbot

      - run: docker run -d -e "PEBBLE_VA_NOSLEEP=1" --net=host ghcr.io/letsencrypt/pebble:latest

      - run: mix deps.get

      - name: Compile project
        run: |
          MIX_ENV=test mix compile --warnings-as-errors
          MIX_ENV=dev mix compile --warnings-as-errors
          MIX_ENV=prod mix compile --warnings-as-errors

      - run: mix format --check-formatted
      - run: mix test || mix test --failed
      - run: mix dialyzer
